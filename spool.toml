name = "warp"
version = "0.1.0"
entry = "src/pipeline.tw"

# twill is here for the language itself, and it is the only dependency. warp
# used to take `src/sha256.tw` from spool, for cache keys and dataset
# verification; twill's own `std/hash` provides it now, so there is still
# exactly one SHA-256 in the toolchain and warp no longer needs a vendored
# directory to compute a cache key. Nothing under `src/` imports spool.
[dependencies]
twill = { version = "^1.7.0", git = "https://github.com/twill-lang/twill" }
